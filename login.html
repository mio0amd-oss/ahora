<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ورود مشتریان فروشگاه اهورا."><meta name="robots" content="noindex,follow"><title>ورود / ثبت‌نام | اهورا</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/reference.css"></head><body><header class="site-header"><div class="container head-main"><a class="brand" href="index.html"><span class="brand-mark">❋</span><span><strong>اهورا</strong><small>ورود / ثبت‌نام</small></span></a><div class="head-actions"><a href="index.html">بازگشت به فروشگاه</a><a href="ar/login.html" lang="ar">العربية</a></div></div></header><main class="container simple-page"><section class="panel form-narrow"><h1>ورود یا ثبت‌نام</h1><p>شمارهٔ موبایل خود را وارد کنید.</p><div class="notice">در این نسخهٔ دمو کد پیامکی ارسال نمی‌شود. ورود با رمز یک‌بارمصرف پس از راه‌اندازی بک‌اند فعال خواهد شد.</div><label class="field">شمارهٔ موبایل<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxxx"></label><button id="loginDemo" class="btn">ادامه در نسخهٔ آزمایشی</button><p><small>با ادامه، نمونهٔ نمایشی حساب کاربری را می‌بینید؛ اطلاعات به سرور ارسال نمی‌شود.</small></p></section></main><div id="toast" class="toast"></div><script>document.getElementById('loginDemo').onclick=()=>{const p=document.getElementById('phone').value.trim();if(!/^09\d{9}$/.test(p)){const t=document.getElementById('toast');t.textContent='شمارهٔ موبایل را با قالب ۰۹xxxxxxxxx وارد کنید.';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);return}localStorage.setItem('ahura_demo_phone',p);location.href='account.html'};</script></body></html>
