<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="تسجيل الدخول إلى متجر أهُورا."><meta name="robots" content="noindex,follow"><title>دخول / تسجيل | أهُورا</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/reference.css"></head><body><header class="site-header"><div class="container head-main"><a class="brand" href="index.html"><span class="brand-mark">❋</span><span><strong>أهُورا</strong><small>دخول / تسجيل</small></span></a><div class="head-actions"><a href="index.html">العودة إلى المتجر</a><a href="../login.html" lang="fa">فارسی</a></div></div></header><main class="container simple-page"><section class="panel form-narrow"><h1>دخول أو تسجيل جديد</h1><p>أدخل رقم هاتفك المحمول.</p><div class="notice">في هذه النسخة التجريبية لا يتم إرسال رمز برسالة نصية. يتطلب تسجيل الدخول برمز لمرة واحدة إعداد الخادم.</div><label class="field">رقم الهاتف<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxxx"></label><button id="loginDemo" class="btn">متابعة تجريبية</button><p><small>هذه معاينة فقط؛ لن تُرسل بياناتك إلى خادم.</small></p></section></main><div id="toast" class="toast"></div><script>document.getElementById('loginDemo').onclick=()=>{const p=document.getElementById('phone').value.trim();if(!/^09\d{9}$/.test(p)){const t=document.getElementById('toast');t.textContent='أدخل رقم هاتف إيراني صالحاً يبدأ بـ 09.';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);return}localStorage.setItem('ahura_demo_phone',p);location.href='account.html'};</script></body></html>
